name: Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag / branch / sha of the private source repo"
        required: true
        default: main
      version:
        description: "Version, e.g. 0.2.1"
        required: true
      channel:
        description: "Build channel"
        required: true
        default: dev
        type: choice
        options: [dev, stable]

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]] || { echo "Invalid version"; exit 1; }

      - name: Check out source
        uses: actions/checkout@v5
        with:
          repository: feiandxs/realmfarers
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
          path: src
          persist-credentials: false

      - name: Cache Godot
        id: cache
        uses: actions/cache@v5
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_RELEASE }}

      - name: Download Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-dl && cd ~/godot-dl
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"

      - name: Install Godot
        run: |
          cd ~/godot-dl
          unzip -qo godot.zip
          mv -f "Godot_v${GODOT_RELEASE}_linux.x86_64" ~/godot
          tdir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$tdir"
          unzip -qo templates.tpz -d ~/tpl
          mv ~/tpl/templates/* "$tdir"/

      - name: Inject version and channel
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          cd src/game
          sed -i '/^config\/version=/d' project.godot
          sed -i "s/^\[application\]$/[application]\n\nconfig\/version=\"${VERSION}\"/" project.godot
          printf '\n[realmfarers]\n\nbuild_channel="%s"\n' "$CHANNEL" >> project.godot
          # The game reads its version from res://version.json (also shipped inside update packs)
          printf '{"version":"%s","channel":"%s"}\n' "$VERSION" "$CHANNEL" > version.json
          # Dev builds are named "Realmfarers Dev": app / window title / exe metadata come from config/name,
          # and so does the user data dir, so a dev install keeps its own user://updates and never shares
          # update packs with a stable install on the same machine (boot.gd does not filter packs by channel).
          if [ "$CHANNEL" = dev ]; then
            sed -i 's/^config\/name=.*/config\/name="Realmfarers Dev"/' project.godot
            sed -i 's/^application\/bundle_identifier=.*/application\/bundle_identifier="io.github.feiandxs.realmfarers.dev"/' export_presets.cfg
          fi
          grep -n '^config/name=' project.godot

      - name: Import
        run: ~/godot --headless --path src/game --import 2>&1 | tail -n 20

      - name: Export
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -e
          # dev: "Realmfarers Dev.app" / "Realmfarers Dev.exe" / Realmfarers-Dev.x86_64, zips Realmfarers-Dev-<ver>-<platform>.zip
          # stable: Realmfarers.app / Realmfarers.exe / Realmfarers.x86_64, zips Realmfarers-<ver>-<platform>.zip
          if [ "$CHANNEL" = dev ]; then app="Realmfarers Dev"; bin="Realmfarers-Dev"; zip="Realmfarers-Dev-${VERSION}"
          else app="Realmfarers"; bin="Realmfarers"; zip="Realmfarers-${VERSION}"; fi
          mkdir -p src/build/windows src/build/linux src/build/macos out
          ~/godot --headless --path src/game --export-release "Windows Desktop" "../build/windows/${app}.exe"
          ~/godot --headless --path src/game --export-release "Linux" "../build/linux/${bin}.x86_64"
          # The .app name inside the macOS zip comes from config/name
          ~/godot --headless --path src/game --export-release "macOS" ../build/macos/Realmfarers.zip
          (cd src/build/windows && zip -qr "$GITHUB_WORKSPACE/out/${zip}-windows.zip" .)
          (cd src/build/linux && chmod +x "${bin}.x86_64" && zip -qr "$GITHUB_WORKSPACE/out/${zip}-linux.zip" .)
          mv src/build/macos/Realmfarers.zip "out/${zip}-macos.zip"
          # Content packs for in-game self-update (one per platform: texture formats differ).
          # Names stay Realmfarers-<ver>-<platform>.pck on both channels (manifest packs[] / old clients).
          ~/godot --headless --path src/game --export-pack "Windows Desktop" "$GITHUB_WORKSPACE/out/Realmfarers-${VERSION}-windows.pck"
          ~/godot --headless --path src/game --export-pack "Linux" "$GITHUB_WORKSPACE/out/Realmfarers-${VERSION}-linux.pck"
          ~/godot --headless --path src/game --export-pack "macOS" "$GITHUB_WORKSPACE/out/Realmfarers-${VERSION}-macos.pck"
          ls -l out

      - name: Write manifest
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          # packs stays "platform -> file name" (0.2.4 and older clients read it that way);
          # sizes / sha256 are new: the updater verifies the pack before installing it.
          args=()
          for p in windows linux macos; do
            f="out/Realmfarers-${VERSION}-${p}.pck"
            args+=(--arg "size_$p" "$(stat -c %s "$f")" --arg "sha_$p" "$(sha256sum "$f" | cut -d' ' -f1)")
          done
          jq -n --arg v "$VERSION" --arg c "$CHANNEL" --arg g "$GODOT_VERSION" "${args[@]}" '{
            version: $v, channel: $c, godot: $g,
            packs: {
              windows: "Realmfarers-\($v)-windows.pck",
              linux: "Realmfarers-\($v)-linux.pck",
              macos: "Realmfarers-\($v)-macos.pck"
            },
            sizes: {windows: ($size_windows|tonumber), linux: ($size_linux|tonumber), macos: ($size_macos|tonumber)},
            sha256: {windows: $sha_windows, linux: $sha_linux, macos: $sha_macos}
          }' > out/manifest.json
          cat out/manifest.json

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          REF: ${{ inputs.ref }}
        run: |
          if [ "$CHANNEL" = stable ]; then tag="v${VERSION}"; pre=""; else tag="v${VERSION}-dev"; pre="--prerelease"; fi
          gh release create "$tag" out/*.zip out/*.pck out/manifest.json --repo "$GITHUB_REPOSITORY" --draft $pre \
            --target "$GITHUB_SHA" --title "Realmfarers $tag" \
            --notes "Realmfarers ${VERSION} (${CHANNEL} build)."
